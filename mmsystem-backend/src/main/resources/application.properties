spring.application.name=mmsystem

# Conexao com o PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/mmsystem
spring.datasource.username=postgres
spring.datasource.password=admin

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# JWT estável entre reinícios (mínimo 32 caracteres)
app.jwt.secret=mm-system-dev-chave-jwt-local-nao-usar-em-producao-2026
app.jwt.expiration-ms=86400000

# Origens do frontend Next.js
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# Desativa a geracao automatica de senha no console para auth via JWT
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Configurações do Jackson para serialização JSON defensiva
spring.jackson.serialization.fail-on-empty-beans=false